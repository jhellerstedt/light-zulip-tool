name: Release APK

# Publishes the Zulip tool the way other Light tools do: a v* tag
# (v plus lighttool.toml versionName) builds the release APK and attaches
# it to a GitHub Release. workflow_dispatch cuts that release from the
# current versionName.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Read tool version
        id: tool
        run: |
          set -euo pipefail
          version="$(awk -F= '/^[[:space:]]*versionName[[:space:]]*=/ {
              value = $2
              gsub(/^[[:space:]"]+|[[:space:]"\r]+$/, "", value)
              print value
              exit
          }' tool/lighttool.toml)"
          if [[ -z "$version" ]]; then
              echo "::error::tool/lighttool.toml has no versionName"
              exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match versionName ${version}"
              exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test and build release APK
        run: ./gradlew :tool:test :tool:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p release
          cp tool/build/outputs/apk/release/tool-release.apk "release/zulip-${{ steps.tool.outputs.version }}.apk"

      - name: Changelog
        id: notes
        run: |
          set -euo pipefail
          tag="v${{ steps.tool.outputs.version }}"
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -v "^${tag}$" | head -n 1 || true)"
          if [[ -n "$previous" ]]; then
              changelog="$(git log "${previous}..HEAD" --pretty=format:'- %s' --no-merges)"
          else
              changelog="$(git log --pretty=format:'- %s' --no-merges)"
          fi
          {
              echo "body<<EOF"
              echo "## What's changed"
              echo "$changelog"
              echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.tool.outputs.version }}
          name: Zulip ${{ steps.tool.outputs.version }}
          files: release/zulip-${{ steps.tool.outputs.version }}.apk
          prerelease: ${{ contains(steps.tool.outputs.version, '-') }}
          make_latest: ${{ !contains(steps.tool.outputs.version, '-') }}
          body: ${{ steps.notes.outputs.body }}
